events {}

http {
    upstream user_service {
        server user-service:8080;
    }

    upstream model_service {
        server model-service:8081;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Модели и вложенные в проект операции направляются в model-service.
        location ~ ^/api/v1/projects/[^/]+/(models|deployments)(/|$) {
            auth_request /_auth;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-ID $user_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Сохраняем полный путь, включая /api/v1.
            proxy_pass http://model_service;
        }

        # User-service проверяет доступ в обработчиках защищённых операций.
        # Регистрация и вход доступны без access token.
        location /api/v1/ {
            proxy_pass http://user_service;
        }

        location = /_auth {
            internal;
            proxy_pass http://user_service/internal/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }

        location / {
            return 404;
        }
    }
}

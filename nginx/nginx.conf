load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    more_set_headers 'Server: Inference Platform';

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/openapi+json application/xml image/svg+xml;

    map $status $static_cache_control {
        default            "no-store";
        ~^(200|206|304)$   "public, max-age=3600";
    }

    upstream user_service {
        server user-service:8080;
    }
    upstream model_service {
        server model-service:8081;
    }
    upstream inference_service {
        server inference-service:8080;
    }
    upstream adminer { server adminer:8080; }
    upstream observability-service {
        server observability-service:8080;
    }
    upstream grafana { server grafana:3000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    # Keep the browser's same-origin check before adapting the Host/Origin for
    # inference-service, which validates its configured public origin.
    map "$http_origin|$scheme://$http_host" $bad_inference_origin {
        default 1;
        "~^\|" 0;
        "~^(.+)\|\1$" 0;
    }
    map $http_origin $inference_origin {
        "" "";
        default "http://localhost:8082";
    }

    server {
        listen 80;
        server_name _;
        root /srv/static;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 2s;
        proxy_read_timeout 95s;
        add_header Cache-Control "no-store" always;

        location = / { try_files /index.html =404; }
        location = /reserved { return 308 /reserved/; }
        location = /reserved/ { try_files /index.html =404; }
        location /static/ { alias /srv/static/; }
        # Only public assets are cacheable; HTML and error responses are not.
        location ~* ^/static/(.+\.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot))$ {
            alias /srv/static/$1;
            add_header Cache-Control $static_cache_control always;
        }
        location = /management { try_files /management.html =404; }
        location = /managment { return 308 /management; }
        location = /legacy { try_files /legacy.html =404; }
        location /downloads/ { alias /srv/downloads/; default_type application/octet-stream; add_header Content-Disposition "attachment"; add_header Cache-Control "no-store" always; }
        location = /documentation { try_files /documentation.html =404; }
        location = /documentation/raw { alias /srv/documentation/README.md; default_type text/plain; charset utf-8; }
        location /docs/ { alias /srv/documentation/docs/; }

        location = /monitoring { absolute_redirect off; return 308 /monitoring/; }
        location ^~ /monitoring/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://grafana;
        }

        location = /api/v1/ { try_files /api.html =404; }

        # One Swagger UI, with both independent OpenAPI documents.
        location = /api/v1/docs { try_files /swagger.html =404; }
        location = /api/v1/docs/ { return 308 /api/v1/docs; }
        location = /api/v1/openapi-user.json { proxy_pass http://user_service/api/v1/openapi.json; }
        location = /api/v1/openapi-model.json { proxy_pass http://model_service/api/v1/openapi.json; }
        location ~ ^/api/v1/projects/[^/]+/(models|deployments)(/|$) {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://model_service;
        }
        location /api/v1/ { proxy_pass http://user_service; }

        # No JWT is required for model inference. Do not buffer streamed tokens.
        location = /inference { return 308 /inference/; }
        location = /inference/metrics { return 404; }
        location ^~ /inference/ {
            if ($bad_inference_origin) { return 403; }
            gzip off;
            proxy_set_header Host localhost:8082;
            proxy_set_header Origin $inference_origin;
            proxy_set_header X-Forwarded-Prefix /inference;
            proxy_set_header X-Inference-Proxy-Prefix /inference;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://inference_service/;
        }

        # The public listener never exposes the database administration UI.
        location = /admin { return 403; }
        location ^~ /admin/ { return 403; }
        location = /status { try_files /status.html =404; }
        location = /status/data { stub_status; add_header Cache-Control "no-store" always; }
        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /healthz { proxy_pass http://observability-service/healthz; }
        location = /healtz { proxy_pass http://observability-service/healthz; }
        location = /ready {
            proxy_pass http://observability-service/ready;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
        location / { return 404; }
    }

    # Published only on the host loopback interface. Adminer requires PostgreSQL
    # credentials; the container itself has no host-published port.
    server {
        listen 8083;
        server_name _;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        location = /admin { return 308 /admin/; }
        location ^~ /admin/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /admin/;
            proxy_pass http://adminer/;
        }
        location / { return 404; }
    }
}

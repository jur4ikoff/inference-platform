<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inference Platform API — mirror</title>
  <link rel="stylesheet" href="static/swagger/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="static/swagger/swagger-ui-bundle.js"></script>
  <script src="static/swagger/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => SwaggerUIBundle({
      dom_id: '#swagger-ui',
      urls: [
        {name: 'User Service', url: '/mirror/api/v1/openapi-user.json'},
        {name: 'Model Service', url: '/mirror/api/v1/openapi-model.json'}
      ],
      'urls.primaryName': 'User Service',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
      deepLinking: true
    });
  </script>
</body>
</html>

apiVersion: 1
prune: true

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - service.name
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"

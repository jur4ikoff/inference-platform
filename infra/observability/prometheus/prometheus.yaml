global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8080"]
  - job_name: model-service
    static_configs:
      - targets:
          - "model-service:8081"
  - job_name: inference-service
    static_configs:
      - targets: ["inference-service:8080"]
  - job_name: observability-service
    static_configs:
      - targets: ["observability-service:8080"]

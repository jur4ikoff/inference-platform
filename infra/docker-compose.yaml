services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - model-service
  user-service:
    build:
      context: ./user-service

    env_file:
      - path: ./user-service/.env
        required: false

    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env or environment}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

    expose:
      - "8080"

    ports:
      - "8080:8080"


  model-service:
    build:
      context: .
      dockerfile: model-service/Dockerfile

    env_file:
      - path: ./model-service/.env
        required: false

    environment:
      HTTP_ADDR: ":8081"
      INFERENCE_GRPC_ADDR: inference-service:9091
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90s}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8081"

    ports:
      - "8081:8081"


  inference-service:
    stop_grace_period: 35s
    build:
      context: .
      dockerfile: inference-service/Dockerfile

    env_file:
      - path: ./inference-service/.env
        required: false

    environment:
      GRPC_ADDR: ":9091"
      HTTP_ADDR: ":8080"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90s}
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-inference-platform}_default

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "9091"
      - "8080"

    ports:
      - "127.0.0.1:9091:9091"
      - "127.0.0.1:8082:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  travel-service:
    build:
      context: ./travel-service

    env_file:
      - path: ./travel-service/.env.example
        required: false

    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env or environment}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}

    expose:
      - "8080"



  # Internal API. Do not publish this port on the host.
  data-collector-service:
    build:
      context: .
      dockerfile: data-collector-service/Dockerfile

    environment:
      GRPC_ADDR: ":9090"
      GRPC_REFLECTION_ENABLED: "true"

    expose:
      - "9090"


  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inferenceplatform}
      POSTGRES_USER: ${POSTGRES_USER:-inferenceplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}

    # Порт доступен сервисам в Docker-сети, но не публикуется на хосте.
    expose:
      - "5432"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml

    volumes:
      - ./infra/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

    expose:
      - "3100"

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

    depends_on:
      loki:
        condition: service_healthy


  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]

    volumes:
      - ./infra/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

    expose:
      - "3200"
      - "4317"


  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]

    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

    expose:
      - "4317"
      - "4318"

    depends_on:
      tempo:
        condition: service_started


  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env or environment}

    # Grafana доступна только с локальной машины; для production
    # её следует проксировать через Nginx с отдельной аутентификацией.
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  postgres_data:
  loki_data:
  alloy_data:
  grafana_data:
  tempo_data:

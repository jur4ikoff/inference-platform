services:

  nginx:
    restart: unless-stopped
    cpus: ${NGINX_CPUS:-1.0}
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: inference-platform-nginx:local
    ports:
      - "${NGINX_HTTP_PORT:-8000}:80"
      - "127.0.0.1:8083:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/srv/static:ro
      - ./README.md:/srv/documentation/README.md:ro
      - ./docs:/srv/documentation/docs:ro
    depends_on:
      - user-service
      - model-service
      - inference-service
      - adminer
      - observability-service
      - grafana

  observability-service:
    restart: unless-stopped
    user: "0:0"
    cpus: ${OBSERVABILITY_SERVICE_CPUS:-0.5}
    mem_limit: ${OBSERVABILITY_SERVICE_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: observability-service/Dockerfile
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  adminer:
    restart: unless-stopped
    cpus: ${ADMINER_CPUS:-0.5}
    mem_limit: ${ADMINER_MEMORY_LIMIT:-128m}
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  user-service:
    container_name: user-service
    restart: unless-stopped
    cpus: ${USER_SERVICE_CPUS:-1.0}
    mem_limit: ${USER_SERVICE_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: user-service/Dockerfile

    env_file:
      - path: ./user-service/.env
        required: false

    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-inferenceplatform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}@postgres:5432/${POSTGRES_DB:-inferenceplatform}?sslmode=disable
      CONTAINER_NAME: user-service
      JWT_PRIVATE_KEY_PATH: /run/secrets/user-service-jwt.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-local-2026-01}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-inference-platform}
      OTEL_ENABLED: "true"
      OTEL_TRACE_SAMPLE_RATIO: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

    expose:
      - "8080"

    volumes:
      - ${JWT_PRIVATE_KEY_FILE:?set JWT_PRIVATE_KEY_FILE in infra/.env}:/run/secrets/user-service-jwt.pem:ro

  model-service:
    container_name: model-service
    restart: unless-stopped
    cpus: ${MODEL_SERVICE_CPUS:-1.0}
    mem_limit: ${MODEL_SERVICE_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: model-service/Dockerfile

    env_file:
      - path: ./model-service/.env
        required: false

    environment:
      HTTP_ADDR: ":8081"
      CONTAINER_NAME: model-service
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DATABASE_URL: postgres://${POSTGRES_USER:-inferenceplatform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}@postgres:5432/${POSTGRES_DB:-inferenceplatform}?sslmode=disable
      INFERENCE_GRPC_ADDR: inference-service:9091
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90s}
      USER_JWKS_URL: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-inference-platform}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8081"

  inference-service:
    container_name: inference-service
    restart: unless-stopped
    cpus: ${INFERENCE_SERVICE_CPUS:-1.0}
    mem_limit: ${INFERENCE_SERVICE_MEMORY_LIMIT:-512m}
    stop_grace_period: 35s
    build:
      context: .
      dockerfile: inference-service/Dockerfile

    env_file:
      - path: ./inference-service/.env
        required: false

    environment:
      PLATFORM_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-inference-platform}
      DATABASE_URL: postgres://${POSTGRES_USER:-inferenceplatform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}@postgres:5432/${POSTGRES_DB:-inferenceplatform}?sslmode=disable
      CONTAINER_NAME: inference-service
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GRPC_ADDR: ":9091"
      HTTP_ADDR: ":8080"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90s}
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-inference-platform}_default

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "9091"
      - "8080"

    ports:
      - "127.0.0.1:9091:9091"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inferenceplatform}
      POSTGRES_USER: ${POSTGRES_USER:-inferenceplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}
      MODEL_SERVICE_RW_PASSWORD: ${MODEL_SERVICE_RW_PASSWORD:?set MODEL_SERVICE_RW_PASSWORD in infra/.env}

    # Порт доступен сервисам в Docker-сети и локально на хосте.
    expose:
      - "5432"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/configure_model_roles.sql:/docker-entrypoint-initdb.d/10-model-roles.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    cpus: ${LOKI_CPUS:-2.0}
    mem_limit: ${LOKI_MEMORY_LIMIT:-2g}
    command: -config.file=/etc/loki/config.yaml

    volumes:
      - ./infra/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

    expose:
      - "3100"

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    cpus: ${ALLOY_CPUS:-1.0}
    mem_limit: ${ALLOY_MEMORY_LIMIT:-384m}
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

    depends_on:
      loki:
        condition: service_healthy


  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    cpus: ${TEMPO_CPUS:-2.0}
    mem_limit: ${TEMPO_MEMORY_LIMIT:-4g}
    command: ["-config.file=/etc/tempo/config.yaml"]

    volumes:
      - ./infra/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

    expose:
      - "3200"
      - "4317"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    cpus: ${PROMETHEUS_CPUS:-1.0}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"


  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    restart: unless-stopped
    cpus: ${OTEL_COLLECTOR_CPUS:-1.0}
    mem_limit: ${OTEL_COLLECTOR_MEMORY_LIMIT:-384m}
    command: ["--config=/etc/otelcol/config.yaml"]

    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

    expose:
      - "4317"
      - "4318"

    depends_on:
      tempo:
        condition: service_started


  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    cpus: ${GRAFANA_CPUS:-2.0}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-2g}

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env or environment}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8000/monitoring/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_EXPLORE_DEFAULTTIMEOFFSET: 30m

    # Прямой порт ограничен localhost; Nginx публикует Grafana под /monitoring/.
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/monitoring/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  postgres_data:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:
  tempo_data:

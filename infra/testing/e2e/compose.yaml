# Applied after the shared test stand for full pipeline runs.
services:
  inference-service:
    environment:
      INFERENCE_SERVER_IMAGE: ${TEST_MODEL_IMAGE:?set TEST_MODEL_IMAGE}

  nginx:
    ports: !reset []

  grafana:
    ports: !reset []

  e2e-model:
    image: ${TEST_MODEL_IMAGE}
    build:
      context: ./infra/testing/e2e
      dockerfile: model.Dockerfile
    profiles: [build]

events {}
http {
  server {
    listen 80;
    location ~ ^/api/v1/projects/[^/]+/(models|deployments)(/|$) {
      proxy_pass http://model-service:8081;
    }
    location /api/v1/ { proxy_pass http://user-service:8080; }
    location /.well-known/ { proxy_pass http://user-service:8080; }
    location /inference/ { proxy_pass http://inference-service:8080/; }
  }
}

x-app: &app
  image: ${LAB2_RUNNER_IMAGE:-inference-lab2-runner:local}
  environment: &environment
    DATABASE_URL: postgres://test:test@postgres:5432/lab2?sslmode=disable
    OTEL_ENABLED: "false"
    JWT_ISSUER: user-service
    JWT_AUDIENCE: inference-platform
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 40
    tmpfs: [/var/lib/postgresql/data]
  runner:
    <<: *app
    build:
      context: ../../..
      dockerfile: infra/testing/lab2/Dockerfile
      args:
        LAB2_SOURCE_REVISION: ${LAB2_SOURCE_REVISION:-unknown}
    environment:
      <<: *environment
      LAB2_MODE: ${LAB2_MODE:-full}
      LAB2_FAIL_STAGE: ${LAB2_FAIL_STAGE:-}
      LAB2_PAUSE_STAGE: ${LAB2_PAUSE_STAGE:-}
      LAB2_PROJECT: ${LAB2_PROJECT:?set LAB2_PROJECT}
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ${LAB2_RESULTS_DIR:?set LAB2_RESULTS_DIR}:/results
      - ${LAB2_HISTORY_DIR:?set LAB2_HISTORY_DIR}:/history
  user-service:
    <<: *app
    entrypoint: [user-service]
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      JWT_PRIVATE_KEY_PATH: /keys/jwt.pem
      JWT_KEY_ID: lab2
    volumes:
      - ${LAB2_RESULTS_DIR}/keys:/keys:ro
  model-service:
    <<: *app
    entrypoint: [model-service]
    environment:
      <<: *environment
      HTTP_ADDR: :8081
      INFERENCE_GRPC_ADDR: inference-service:9091
      USER_JWKS_URL: http://user-service:8080/.well-known/jwks.json
  inference-service:
    <<: *app
    entrypoint: [inference-service]
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      GRPC_ADDR: :9091
      INFERENCE_SERVER_IMAGE: ${LAB2_MODEL_IMAGE:?set LAB2_MODEL_IMAGE}
      DOCKER_NETWORK: ${LAB2_PROJECT}_default
      PLATFORM_COMPOSE_PROJECT: ${LAB2_PROJECT}
      CONTAINER_METRICS_PROJECTS: ${LAB2_PROJECT}
      DEPLOYMENT_MANAGER_SYNC_INTERVAL: 1s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [user-service, model-service, inference-service]
  model-fixture:
    image: ${LAB2_MODEL_IMAGE}
    build:
      context: .
      dockerfile: model.Dockerfile
    profiles: [build]

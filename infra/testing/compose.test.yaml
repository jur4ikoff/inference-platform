# Applied after infra/docker-compose.yaml from the repository root.
services:
  postgres:
    image: inference-lab2-postgres:local
    restart: "no"
    ports: !reset []
    volumes: !override
      - ./infra/postgres/configure_model_roles.sql:/docker-entrypoint-initdb.d/10-model-roles.sql:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]

  user-service:
    container_name: !reset null
    env_file: !reset []

  model-service:
    container_name: !reset null
    env_file: !reset []

  inference-service:
    container_name: !reset null
    env_file: !reset []
    ports: !reset []
    environment:
      CONTAINER_METRICS_PROJECTS: ${LAB2_PROJECT:?set LAB2_PROJECT}
      DEPLOYMENT_MANAGER_SYNC_INTERVAL: 1s

  runner:
    image: ${LAB2_RUNNER_IMAGE}
    build:
      context: .
      dockerfile: infra/testing/test-runner.Dockerfile
      args:
        LAB2_SOURCE_REVISION: ${LAB2_SOURCE_REVISION:-unknown}
    environment:
      LAB2_MODE: ${LAB2_MODE:-full}
      LAB2_FAIL_STAGE: ${LAB2_FAIL_STAGE:-}
      LAB2_PAUSE_STAGE: ${LAB2_PAUSE_STAGE:-}
      LAB2_PROJECT: ${LAB2_PROJECT}
    volumes:
      - ${LAB2_RESULTS_DIR:?set LAB2_RESULTS_DIR}:/results
      - ${LAB2_HISTORY_DIR:?set LAB2_HISTORY_DIR}:/history

# Applied after infra/docker-compose.yaml from the repository root.
services:
  postgres:
    image: inference-test-postgres:local
    restart: "no"
    ports: !reset []
    volumes: !override
      - ./infra/postgres/configure_model_roles.sql:/docker-entrypoint-initdb.d/10-model-roles.sql:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]

  user-service:
    container_name: !reset null
    env_file: !reset []

  model-service:
    container_name: !reset null
    env_file: !reset []

  inference-service:
    container_name: !reset null
    env_file: !reset []
    ports: !reset []
    environment:
      CONTAINER_METRICS_PROJECTS: ${TEST_PROJECT:?set TEST_PROJECT}
      DEPLOYMENT_MANAGER_SYNC_INTERVAL: 1s

  runner:
    image: ${TEST_RUNNER_IMAGE}
    build:
      context: .
      dockerfile: infra/testing/test-runner.Dockerfile
      args:
        TEST_SOURCE_REVISION: ${TEST_SOURCE_REVISION:-unknown}
    environment:
      TEST_MODE: ${TEST_MODE:-full}
      TEST_FAIL_STAGE: ${TEST_FAIL_STAGE:-}
      TEST_PAUSE_STAGE: ${TEST_PAUSE_STAGE:-}
      TEST_PROJECT: ${TEST_PROJECT}
    volumes:
      - ${TEST_RESULTS_DIR:?set TEST_RESULTS_DIR}:/results
      - ${TEST_HISTORY_DIR:?set TEST_HISTORY_DIR}:/history

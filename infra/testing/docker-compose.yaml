services:
  postgres:
    image: postgres:16-alpine
    cpus: ${TEST_POSTGRES_CPUS:-1.0}
    mem_limit: ${TEST_POSTGRES_MEMORY_LIMIT:-384m}
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

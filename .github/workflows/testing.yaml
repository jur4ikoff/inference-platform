name: Testing
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: &test_steps
      - name: Configure test paths
        run: |
          {
            echo "TEST_PROJECT=inference-tests-ci-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "TEST_RESULTS_DIR=$GITHUB_WORKSPACE/test-results/pipeline/$GITHUB_JOB"
            echo "TEST_HISTORY_DIR=$GITHUB_WORKSPACE/test-results/pipeline/history/$GITHUB_JOB"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Set up Go for lint
        if: github.job == 'unit'
        uses: actions/setup-go@v6
        with:
          go-version-file: user-service/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Run linters
        if: github.job == 'unit'
        run: |
          python3 -m venv "$RUNNER_TEMP/prek"
          "$RUNNER_TEMP/prek/bin/python" -m pip install 'prek==0.4.13'
          make lint PREK="$RUNNER_TEMP/prek/bin/prek"
      - name: Restore Allure history
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TEST_HISTORY_DIR }}
          key: allure-tests-${{ github.job }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-tests-${{ github.job }}-${{ github.ref_name }}-
      - name: Run ${{ github.job }} tests
        run: python3 infra/testing/run_test_pipeline.py "$GITHUB_JOB"
      - name: Finalize after cancellation or early failure
        if: always()
        run: |
          if [ ! -f "$TEST_RESULTS_DIR/report-complete" ] && docker image inspect inference-test-runner:local >/dev/null 2>&1; then
            python3 infra/testing/run_test_pipeline.py finalize
          fi
      - name: Set ownership of test outputs for the GitHub runner
        if: always()
        run: |
          owner="$(id -u):$(id -g)"
          for directory in "$TEST_RESULTS_DIR" "$TEST_HISTORY_DIR"; do
            if [ -d "$directory" ]; then
              sudo chown -hR -- "$owner" "$directory"
            fi
          done
      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TEST_HISTORY_DIR }}
          key: allure-tests-${{ github.job }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_RESULTS_DIR }}/**
            !${{ env.TEST_RESULTS_DIR }}/keys/**
          if-no-files-found: warn
          retention-days: 14
  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: *test_steps
  e2e:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: *test_steps
